plugins {
    id 'com.android.application' version '8.5.0' apply true
}

android {
    namespace 'com.example.wlanscannerfh'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.wlanscannerfh"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // الواجهات والاعتمادات الأساسية
}
